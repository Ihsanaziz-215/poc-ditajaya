<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype Modul Form Breakdown</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--card:#fff;--text:#1F2430;--muted:#6B7280;--line:#E5E7EB;--th:#F8F9FB;--pri:#D8485A;--link:#D8485A;--pri-h:#C23B4D;--pri-soft:#FCE9EB;--info:#1D6FB8;--info-soft:#DDEBF9;--ok:#15803D;--ok-soft:#DCF3E4;--warn:#A64B0A;--warn-soft:#FDEBCB;--bad:#B91C1C;--bad-soft:#FBE3E3;--gray:#4B5563;--gray-soft:#ECEEF1;--input:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1B1E24;--text:#E6E8EC;--muted:#9AA1AD;--line:#2B2F37;--th:#20242B;--pri:#D4485A;--link:#F0808C;--pri-h:#E0596B;--pri-soft:#3A2227;--info:#7DBBF3;--info-soft:#1F3347;--ok:#6AD596;--ok-soft:#1B3326;--warn:#F2B35C;--warn-soft:#3B2E17;--bad:#F29A9A;--bad-soft:#3C2224;--gray:#B4BAC4;--gray-soft:#2A2E36;--input:#161920;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--card:#1B1E24;--text:#E6E8EC;--muted:#9AA1AD;--line:#2B2F37;--th:#20242B;--pri:#D4485A;--link:#F0808C;--pri-h:#E0596B;--pri-soft:#3A2227;--info:#7DBBF3;--info-soft:#1F3347;--ok:#6AD596;--ok-soft:#1B3326;--warn:#F2B35C;--warn-soft:#3B2E17;--bad:#F29A9A;--bad-soft:#3C2224;--gray:#B4BAC4;--gray-soft:#2A2E36;--input:#161920;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:60}
button{font:inherit;cursor:pointer}
a{color:var(--link);text-decoration:none;cursor:pointer}
.shell{display:flex;min-height:100vh}
.side{width:64px;flex:none;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;z-index:30;overflow:visible}
.side a{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--text);position:relative}
.side a svg{width:21px;height:21px}
.side a.active{background:var(--pri);color:#fff}
.side a:hover:not(.active){background:var(--gray-soft)}
.side a::after{content:attr(data-tip);position:absolute;left:50px;top:50%;transform:translateY(-50%);background:#111827;color:#fff;font-size:12px;padding:4px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;z-index:80}
.side a:hover::after,.side a:focus-visible::after{opacity:1}
.side hr{width:28px;border:0;border-top:1px solid var(--line);margin:6px 0}
.main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;min-height:60px;background:var(--card);display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:42px;height:34px;border:2.5px solid var(--pri);border-radius:5px;color:var(--pri);font-weight:700;display:grid;place-items:center;font-size:17px;letter-spacing:-1px}
.spill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;width:min(440px,38vw);color:var(--muted)}
.spill input{border:0;outline:0;background:transparent;color:var(--text);width:100%;font:inherit;padding:0}
.spill svg{width:18px;height:18px;flex:none}
.fab{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;border:0;display:grid;place-items:center}
.fab svg{width:20px;height:20px}
.sp{flex:1}
.demo{display:flex;align-items:center;gap:8px;border:1px dashed var(--muted);border-radius:12px;padding:4px 6px 4px 10px;background:var(--bg)}
.demo small{color:var(--muted);font-size:12px}
.roles{display:flex;gap:3px;background:var(--card);padding:3px;border-radius:9px;border:1px solid var(--line)}
.rp{border:0;background:transparent;color:var(--text);padding:5px 11px;border-radius:7px;font-size:13px;font-weight:500}
.rp.on{background:var(--pri);color:#fff;font-weight:600}
.ib{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;position:relative}
.ib:hover{background:var(--gray-soft)}
.ib svg{width:20px;height:20px}
.dot{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--pri);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:38px;height:38px;border-radius:50%;background:#E27BB0;color:#fff;font-weight:700;display:grid;place-items:center}
.bellwrap{position:relative}
.pop{position:absolute;right:0;top:46px;width:340px;max-height:420px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:70}
.pop h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;align-items:center}
.pop .it{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.pop .it:hover{background:var(--th)}
.pop .it.un{border-left:3px solid var(--pri)}
.pop .it small{color:var(--muted)}
.page{padding:20px 24px 48px;max-width:1440px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;min-width:0}
.card h3{margin:0 0 2px;font-size:16px;font-weight:700}
.card .sub{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ch .sub{margin-bottom:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{font-size:15px;color:var(--text)}
.crumb a{color:var(--link)}
.phead h1{margin:6px 0 0;font-size:25px;font-weight:700;letter-spacing:-.3px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;background:var(--pri);color:#fff;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--pri-h)}
.btn svg{width:16px;height:16px}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.sec:hover{background:var(--th)}
.btn.info{background:var(--info-soft);color:var(--info)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical;min-height:80px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
input[disabled],select[disabled],textarea[disabled]{opacity:.7;background:var(--th)}
label.l{display:block;font-weight:500;margin:0 0 6px}
.req{color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px}
.fld.full{grid-column:1/-1}
.err{color:var(--bad);font-size:12.5px;margin-top:4px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools .spill{width:260px;height:38px;border-radius:8px}
.pager{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted)}
.pager select{width:64px;padding:6px 8px}
.filt{display:flex;gap:12px;flex-wrap:wrap;background:var(--th);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;align-items:end}
.filt>div{min-width:170px}
.wrapx{overflow-x:auto;border-top:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--th);text-align:left;font-weight:500;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--th)}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl input,.tbl select{padding:6px 9px;min-width:90px}
.tbl input.q{width:80px;min-width:0;text-align:right}
.tbl input.p{width:140px;text-align:right}
.miss{border-color:var(--pri)!important;background:var(--pri-soft)!important}
.b{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--ok-soft);color:var(--ok)}.b.warn{background:var(--warn-soft);color:var(--warn)}.b.bad{background:var(--bad-soft);color:var(--bad)}.b.info{background:var(--info-soft);color:var(--info)}.b.gray{background:var(--gray-soft);color:var(--gray)}.b.pri{background:var(--pri-soft);color:var(--pri)}
.tbc{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:5px;background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:700;cursor:help;vertical-align:middle}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.sg{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px;background:var(--card)}
.sg small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 16px;margin-bottom:16px;border:1px solid var(--line);background:var(--card)}
.banner.turn{background:var(--pri-soft);border-color:var(--pri)}
.banner.stop{background:var(--bad-soft);border-color:var(--bad)}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner b{display:block}
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.st{flex:1;min-width:104px;text-align:center;position:relative;padding:0 4px}
.st::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st.done::before,.st.cur::before{background:var(--ok)}
.st.stop::before{background:var(--ok)}
.st i{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:var(--card);border:2px solid var(--line);color:var(--muted)}
.st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.st.cur i{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
.st.stop i{background:var(--bad);border-color:var(--bad);color:#fff}
.st.warn i{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.st b{display:block;font-size:13px;font-weight:600}
.st small{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 24px}
.kv small{display:block;color:var(--muted);margin-bottom:2px}
.kv div.w{grid-column:1/-1}
.hint{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:10px}
.hint svg{width:15px;height:15px;flex:none}
.addrow{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.addrow input.n{flex:1;min-width:200px}
.addrow input.q{width:90px}
.tot{display:flex;justify-content:flex-end;gap:24px;padding:12px 14px;font-weight:700}
.sum{margin-left:auto;width:min(360px,100%)}
.sum div{display:flex;justify-content:space-between;padding:6px 0}
.sum div.g{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-weight:700;font-size:15px}
.cm{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:320px;overflow:auto}
.cmi{border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.cmi small{color:var(--muted)}
.cmi p{margin:4px 0 0;white-space:pre-wrap}
.logbox{max-height:380px;overflow:auto;border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:-4px -20px 16px;padding:0 20px}
.tab{padding:12px 16px;border:0;background:transparent;color:var(--text);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.vers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vb{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:4px 11px;font-weight:600;font-size:13px}
.vb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:90;display:grid;place-items:center;padding:16px}
.mod{background:var(--card);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;border:1px solid var(--line)}
.mod.wide{width:min(820px,100%)}
.mod h3{margin:0 0 4px;font-size:18px}
.mod .acts{justify-content:flex-end;margin-top:18px}
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:120;max-width:min(380px,calc(100vw - 36px))}
.toast{background:#1F2430;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;border-left:4px solid var(--pri)}
.toast.ok{border-left-color:#34C26B}.toast.info{border-left-color:#4DA3F0}.toast.bad{border-left-color:#F26B6B}
.paper{background:#fff;color:#111;font:12.5px/1.5 Arial,Helvetica,sans-serif;padding:26px 28px;border:1px solid #d9d9d9;position:relative}
.paper h2{margin:0;font-size:17px;letter-spacing:.3px}
.paper table{width:100%;border-collapse:collapse;margin-top:12px}
.paper th,.paper td{border:1px solid #444;padding:4px 7px;text-align:left;font-size:12px}
.paper td.r,.paper th.r{text-align:right}
.paper .hd{display:flex;gap:14px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}
.paper .lg{width:56px;height:46px;border:3px solid #D8485A;border-radius:6px;color:#D8485A;font-weight:700;display:grid;place-items:center;font-size:20px;flex:none}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin:10px 0}
.paper .stamp{position:absolute;right:30px;top:90px;border:3px solid #B91C1C;color:#B91C1C;font-weight:700;font-size:20px;padding:2px 12px;transform:rotate(-8deg);letter-spacing:1px}
.paper ol{margin:4px 0 0 18px;padding:0}
.empty{text-align:center;color:var(--muted);padding:28px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.lbl-rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.lbl-rule div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lbl-rule b{display:block;margin-bottom:2px}
@media (max-width:820px){
 .shell{flex-direction:column}
 .side{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:58px;flex-direction:row;justify-content:flex-start;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);gap:4px}
 .side a::after{display:none}
 .side hr{width:0;height:26px;border-top:0;border-left:1px solid var(--line);margin:0 4px}
 .page{padding:14px 12px 90px}
 .grid2,.grid3{grid-template-columns:1fr}
 .spill{display:none}
 .top{padding:8px 12px}
 .pop{position:fixed;left:12px;right:12px;width:auto;top:70px}
 #toasts{bottom:78px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ===== util ===== */
const ROLES=['Teknisi','Purchasing','Sales','Gudang'];
const PERSON={Teknisi:'Ari Dwi',Purchasing:'Sari',Sales:'Rully',Gudang:'Joko'};
const t0=Date.now(),BASE=new Date(2026,9,15,16,10).getTime();
const now=()=>new Date(BASE+(Date.now()-t0));
const TODAY=()=>{const d=now();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pad=n=>String(n).padStart(2,'0');
const fd=d=>{d=new Date(d);return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const fdt=d=>{d=new Date(d);return `${fd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};

const rn=n=>Number(n||0).toLocaleString('id-ID');

let _n=100;const uid=()=>'i'+(++_n);
const $=s=>document.querySelector(s);
const IC={
gauge:'<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l3-5"/><circle cx="12" cy="17" r="1.4"/>',
leads:'<circle cx="7" cy="12" r="3"/><circle cx="17" cy="12" r="3"/><path d="M10 12h4"/>',

contact:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M8 17c1-2 7-2 8 0"/>',
box:'<path d="M4 8h16v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM3 4h18v4H3zM10 12h4"/>',
flow:'<circle cx="6" cy="6" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><path d="M6 8v8M8 6h4a4 4 0 0 1 4 4"/>',
tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
truck:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
pack:'<path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
bell:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/>',
moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
pen:'<path d="M4 20l1-5L16 4l4 4L9 19z"/>',
file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
send:'<path d="M21 3L3 11l7 3 3 7z"/>',
reset:'<path d="M4 12a8 8 0 1 0 3-6"/><path d="M4 4v5h5"/>',

/* ===== derived ===== */
const PRC={'Perlu Follow Up':5,'Belum Diproses':4,'Indent':3,'Dibeli':2,'In Stock':1};
function procOf(f){if(f.status!=='Disetujui')return'—';const ps=act(f).map(i=>i.proc||'Belum Diproses');if(!ps.length)return'—';return ps.sort((a,b)=>PRC[b]-PRC[a])[0]}
const okItem=i=>i.proc==='In Stock'||(!!i.proc&&i.good>=i.qty);
const allGood=f=>act(f).length>0&&act(f).every(okItem);
function recvOf(f){if(procOf(f)==='—')return'—';const a=act(f);if(a.some(i=>i.proc==='Perlu Follow Up'))return'Diterima Rusak';if(a.every(i=>i.proc==='In Stock'))return'Tidak Perlu';if(allGood(f))return'Diterima Baik';return'Belum Diterima'}
function turnRaw(f){
 if(f.done||f.status==='Batal')return null;
 if(f.status==='Draft')return{role:'Teknisi',text:'Lengkapi daftar barang lalu ajukan form.'};
 if(f.status==='Diajukan')return{role:'Purchasing',text:'Isi harga dan supplier tiap barang, lalu kirim ke Sales.'};
 if(f.status==='Harga Terisi')return{role:'Sales',text:'Sesuaikan harga dan qty, coret barang yang tidak dibutuhkan customer, kirim quotation, lalu putuskan Disetujui atau Batal.'};
 const p=procOf(f);
 if(p==='Belum Diproses'||p==='Perlu Follow Up')return{role:'Purchasing',text:p==='Belum Diproses'?'Cek barang yang disetujui customer: tandai In Stock, Dibeli, atau Indent.':'Follow up retur ke supplier, lalu kembali ke status Dibeli.'};
 if(!allGood(f))return{role:'Gudang',text:'Stock In barang yang datang beserta kondisinya.'};
 if(f.conf==='Tidak Sesuai')return{role:'Sales',text:'Pekerjaan terkunci. Revisi form bersama klien.'};
 if(f.conf==='Sesuai')return{role:'Teknisi',text:'Barang sesuai. Kerjakan breakdown.'};
 return{role:'Teknisi',text:'Cek barang lalu konfirmasi Sesuai atau Tidak Sesuai.'};
}
function turnOf(f){const t=turnRaw(f);if(t&&S.role==='Sales'&&t.role==='Gudang')return{role:'Purchasing',text:'Pengadaan barang sedang berjalan.'};return t}
function stepOf(f){
 const q=getQ(f.id);
 if(f.status==='Draft')return{cur:0};
 if(f.status==='Diajukan')return{cur:1};
 if(f.status==='Harga Terisi')return{cur:(q&&lastV(q).status==='Terkirim')?3:2};
 if(f.status==='Batal')return{cur:3,stop:true};
 if(f.done)return{cur:8};
 if(f.conf==='Sesuai')return{cur:7};
 if(allGood(f))return{cur:6,warn:f.conf==='Tidak Sesuai'};
 const p=procOf(f);
 if(p==='Belum Diproses'||p==='Perlu Follow Up')return{cur:4};
 return{cur:5};
}

function newVersion(q,why){
 const lv=lastV(q),v=JSON.parse(JSON.stringify(lv));
 v.ver=lv.ver+1;v.date=now().getTime();v.status='Belum Dikirim';v.sentTo='';v.cc='';v.sentAt=null;
 q.versions.push(v);(S.ui.qv=S.ui.qv||{})[q.id]=q.versions.length-1;
 const f=q.formId&&getF(q.formId);
 if(f)log(f,`Buat Quotation v${v.ver} (${why})`,'—','Belum Dikirim');
 toast(`Versi baru dibuat: Quotation v${v.ver}. Versi lama tetap tersimpan.`,'info');
 return v;
}
function syncQuote(f){
 const q=getQ(f.id);if(!q)return;
 let v=lastV(q);
 if(v.status==='Terkirim')v=newVersion(q,'revisi harga atau qty setelah terkirim');
 const old=v.items;
 v.items=act(f).map(i=>({iid:i.id,name:i.name,qty:i.qty,price:i.price,disc:(old.find(o=>o.iid===i.id)||{}).disc||0}));
}

A.reset=()=>{seed();location.hash='#/breakdown';render();toast('Data demo dikembalikan ke awal','ok')};
A.dark=()=>{const r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark');render()};
A.live=n=>toast(`Menu ${n} sudah live di app dan tidak dibuat ulang di prototype ini.`);
A.bell=()=>{S.ui.bell=!S.ui.bell;render()};
A.readAll=()=>{S.notifs.forEach(n=>{if(n.roles.includes(S.role))n.read[S.role]=true});render()};
A.openN=id=>{const n=S.notifs.find(x=>x.id===id);if(!n)return;n.read[S.role]=true;S.ui.bell=false;A.go(n.link||('#/breakdown/'+n.fid));render()};
A.strike=(fid,iid)=>{const f=getF(fid),it=f.items.find(i=>i.id===iid);if(S.role!=='Sales'||f.status!=='Harga Terisi')return;
 if(!it.struck&&act(f).length<2){toast('Minimal satu barang harus tetap aktif.','bad');return}
 it.struck=!it.struck;log(f,`${it.struck?'Coret':'Batal coret'} barang — ${it.name}`,it.struck?'Aktif':'Dicoret',it.struck?'Dicoret':'Aktif');syncQuote(f);
 toast(it.struck?'Barang dicoret. Tidak ikut dibeli dan tidak masuk quotation.':'Coret dibatalkan.',it.struck?'info':'');render()};
A.followUp=cid=>{const c=S.customers.find(x=>x.id===cid);c.acts.push({date:iso(TODAY()),what:'Follow up (demo)'});S.notifs=S.notifs.filter(n=>n.cid!==cid);toast(`Follow up ${c.name} dicatat sebagai Activity. Notifikasi dihapus.`,'ok');render()};
A.close=()=>{S.modal=null;render()};
A.modal=(type,data)=>{S.modal=Object.assign({type},data||{});render()};
A.ask=(title,text,ok,fn)=>{S.modal={type:'confirm',title,text,okLabel:ok,fn};render()};
A.okAsk=()=>{const fn=S.modal&&S.modal.fn;S.modal=null;if(fn)fn();render()};
A.setUI=(k,v)=>{S.ui[k]=v;render()};
A.tog=k=>{S.ui[k]=!S.ui[k];render()};

/* create form */
A.nfInit=()=>{S.ui.nf={cust:'',date:iso(TODAY()),analysis:'',note:'',items:[{name:'',qty:1}]};S.ui.nfErr=null};
A.nf=(k,v)=>{S.ui.nf[k]=v};
A.nfItem=(i,k,v)=>{S.ui.nf.items[i][k]=k==='qty'?Number(v):v};
A.nfAdd=()=>{S.ui.nf.items.push({name:'',qty:1});render()};
A.nfDel=i=>{if(S.ui.nf.items.length>1){S.ui.nf.items.splice(i,1);render()}};
A.nfSave=submit=>{
 const n=S.ui.nf,e={};
 if(submit){
  if(!n.cust)e.cust='Pilih customer.';
  if(!n.date)e.date='Isi tanggal analisa.';
  if(!n.analysis.trim())e.analysis='Hasil analisa wajib diisi.';
  if(!n.items.some(i=>i.name.trim()&&i.qty>0))e.items='Isi minimal satu barang dengan nama dan qty.';
  else if(n.items.some(i=>(i.name.trim()&&!(i.qty>0))||(!i.name.trim()&&i.qty>0&&n.items.length>1&&false)))e.items='Qty harus lebih dari 0.';
 }else if(!n.cust){e.cust='Pilih customer untuk menyimpan draft.'}
 if(Object.keys(e).length){S.ui.nfErr=e;render();toast('Form belum lengkap. Cek field yang ditandai.','bad');return}
 S.fseq++;
 const id=`BD-2610-${String(S.fseq).padStart(3,'0')}`;
 const f={id,cust:n.cust,tech:PERSON.Teknisi,date:n.date,analysis:n.analysis.trim(),note:n.note.trim(),items:n.items.filter(i=>i.name.trim()&&i.qty>0).map(i=>({id:uid(),name:i.name.trim(),qty:i.qty,price:0,supplier:'',proc:null,eta:'',pnote:'',good:0,bad:0})),status:submit?'Diajukan':'Draft',conf:'Menunggu',confNote:'',done:false,log:[],comments:[]};
 S.forms.unshift(f);
 log(f,'Buat form','—','Draft');
 if(submit){log(f,'Ubah status pengajuan','Draft','Diajukan');notify(['Purchasing'],id,`Form Diajukan: ${id} ${f.cust}`)}
 else toast('Draft tersimpan','ok');
 S.ui.nf=null;A.go('#/breakdown/'+id);render();
};
A.submitDraft=fid=>{
 const f=getF(fid);
 if(!f.items.length||f.items.some(i=>!i.name.trim()||!(i.qty>0))){toast('Lengkapi nama dan qty semua barang dulu.','bad');return}
 f.status='Diajukan';log(f,'Ubah status pengajuan','Draft','Diajukan');notify(['Purchasing'],f.id,`Form Diajukan: ${f.id} ${f.cust}`);render();
};

/* items */
A.editItem=(fid,iid,k,val)=>{
 const f=getF(fid),it=f.items.find(i=>i.id===iid);if(!it)return;
 if(k==='price'&&!canPrice(f))return;
 if((k==='name'||k==='qty')&&!canStruct(f))return;
 if(k==='supplier'&&!canSup(f))return;
 let nv=(k==='qty'||k==='price')?Number(val):String(val).trim();
 if(k==='qty'&&!(nv>=1)){toast('Qty minimal 1.','bad');render();return}
 if(k==='price'&&!(nv>=0)){toast('Harga tidak valid.','bad');render();return}
 if(k==='name'&&!nv){toast('Nama barang tidak boleh kosong.','bad');render();return}
 const ov=it[k];if(ov===nv)return;
 it[k]=nv;
 log(f,`Ubah ${FL[k]} — ${k==='name'?ov:it.name}`,fv(k,ov),fv(k,nv));
 if(S.role==='Sales')syncQuote(f);
 render();
};
A.addItem=fid=>{
 const f=getF(fid),nm=($('#ai-name')||{}).value||'',q=Number(($('#ai-qty')||{}).value);
 if(!nm.trim()||!(q>=1)){toast('Isi nama barang dan qty minimal 1.','bad');return}
 f.items.push({id:uid(),name:nm.trim(),qty:q,price:0,supplier:'',proc:null,eta:'',pnote:'',good:0,bad:0});
 log(f,'Tambah barang','—',`${nm.trim()} × ${q}`);
 if(S.role==='Sales')syncQuote(f);
 render();
};
A.delItem=(fid,iid)=>{
 const f=getF(fid),it=f.items.find(i=>i.id===iid);
 if(f.items.length<2){toast('Form harus punya minimal satu barang.','bad');return}
 A.ask('Hapus barang?',`${it.name} akan dihapus dari form. Penghapusan tercatat di log perubahan.`,'Hapus',()=>{
  f.items=f.items.filter(i=>i.id!==iid);log(f,'Hapus barang',`${it.name} × ${it.qty}`,'—');if(S.role==='Sales')syncQuote(f);});
};

/* pricing */
A.sendToSales=fid=>{
 const f=getF(fid);
 if(f.items.some(i=>!(i.price>0)||!i.supplier)){S.ui.attempt=fid;render();toast('Harga dan supplier wajib terisi untuk semua barang.','bad');return}
 f.status='Harga Terisi';log(f,'Ubah status pengajuan','Diajukan','Harga Terisi');notify(['Sales'],f.id,`Harga Terisi: ${f.id} ${f.cust}`);S.ui.attempt=null;render();
};
A.decide=(fid,res)=>{
 const f=getF(fid);
 A.ask(res==='Disetujui'?'Tandai Disetujui?':'Batalkan form?',
  res==='Disetujui'?'Form masuk ke antrean pengadaan Purchasing. Isi form terkunci setelah keputusan.':'Form ditutup dan tidak masuk antrean Purchasing.',
  res==='Disetujui'?'Disetujui':'Batalkan form',()=>{
   const old=f.status;f.status=res;log(f,'Ubah status pengajuan',old,res);
   
   notify(['Purchasing','Teknisi'],f.id,`${res}: ${f.id} ${f.cust}`);});
};
A.reviseForm=fid=>{
 const f=getF(fid);
 A.ask('Revisi form?','Form kembali ke Sales untuk direvisi, konfirmasi teknisi di-reset ke Menunggu. Aturan revisi ini masih TBC di PRD.','Revisi form',()=>{
  f.status='Harga Terisi';f.conf='Menunggu';log(f,'Ubah status pengajuan','Disetujui','Harga Terisi');log(f,'Ubah status konfirmasi','Tidak Sesuai','Menunggu');toast('Form kembali ke Sales untuk direvisi','info');});
};

/* procurement */
A.setProc=(fid,iid,v)=>{
 const f=getF(fid),it=f.items.find(i=>i.id===iid);if(S.role!=='Purchasing'||!v||it.proc===v)return;
 log(f,`Ubah status pengadaan — ${it.name}`,it.proc||'Belum Diproses',v);it.proc=v;if(allGood(f))notify(['Teknisi'],f.id,`Barang siap: ${f.id} bisa dikonfirmasi`);render();
};
A.procInfo=(fid,iid,k,v)=>{
 const f=getF(fid),it=f.items.find(i=>i.id===iid);if(S.role!=='Purchasing'||it[k]===v.trim())return;
 log(f,`Ubah ${FL[k]} — ${it.name}`,fv(k,it[k]),fv(k,v.trim()));it[k]=v.trim();render();
};
A.resolveFU=(fid,iid)=>{
 const f=getF(fid),it=f.items.find(i=>i.id===iid);
 log(f,`Follow up retur selesai — ${it.name} ×${it.bad} dikembalikan ke ${it.supplier}`,'Perlu Follow Up','Dibeli');
 it.bad=0;it.proc='Dibeli';toast('Barang dibeli ulang. Gudang bisa mencatat penerimaan lagi.','ok');render();
};
A.allBought=fid=>{
 const f=getF(fid);let n=0;
 act(f).forEach(i=>{if(!i.proc){log(f,`Ubah status pengadaan — ${i.name}`,'Belum Diproses','Dibeli');i.proc='Dibeli';n++}});
 toast(n?`${n} barang ditandai Dibeli`:'Semua barang sudah punya status pengadaan',n?'ok':'');render();
};

/* receiving */
const remain=i=>Math.max(i.qty-i.good-i.bad,0);
A.recv=(fid,iid)=>{const it=getF(fid).items.find(i=>i.id===iid);A.modal('receive',{fid,iid,date:iso(TODAY()),qty:remain(it)})};
A.saveRecv=()=>{
 const m=S.modal,f=getF(m.fid),it=f.items.find(i=>i.id===m.iid);
 const q=Number($('#rv-qty').value),cond=$('#rv-cond').value,date=$('#rv-date').value,note=$('#rv-note').value.trim();
 const er=$('#rv-err');
 if(!date||!(q>=1)){er.textContent='Isi tanggal terima dan qty minimal 1.';return}
 if(q>remain(it)){er.textContent=`Qty melebihi sisa pesanan (${remain(it)}).`;return}
 S.modal=null;
 log(f,`Stock In ${it.name} ×${q} — ${cond} (Supplier: ${it.supplier})${note?` · ${note}`:''}`,'',`${q} ${cond}`);
 if(cond==='Baik'){it.good+=q;it.stock=(it.stock||0)+q;if(allGood(f))notify(['Teknisi'],f.id,`Barang Diterima Baik: ${f.id} siap dikonfirmasi`)}
 else{it.bad+=q;const ov=it.proc;it.proc='Perlu Follow Up';log(f,`Ubah status pengadaan — ${it.name}`,ov,'Perlu Follow Up',true);notify(['Purchasing'],f.id,`Barang Diterima Rusak: ${it.name} ×${q} (Supplier ${it.supplier})`)}
 render();
};
A.recvAll=fid=>{
 const f=getF(fid);let n=0;
 act(f).forEach(i=>{if((i.proc==='Dibeli'||i.proc==='Indent')&&remain(i)>0){const q=remain(i);i.good+=q;log(f,`Stock In ${i.name} ×${q} — Baik (Supplier: ${i.supplier})`,'',`${q} Baik`);n++}});
 if(!n){toast('Tidak ada barang yang siap diterima (harus berstatus Dibeli atau Indent).','bad');return}
 toast(`${n} barang dicatat Diterima Baik`,'ok');if(allGood(f))notify(['Teknisi'],f.id,`Barang Diterima Baik: ${f.id} siap dikonfirmasi`);render();
};

/* confirm & finish */
A.confirm=(fid,res)=>{
 const f=getF(fid),note=(($('#cf-note')||{}).value||'').trim();
 if(res==='Tidak Sesuai'&&!note){S.ui.cfErr=true;render();toast('Tulis catatan alasan Tidak Sesuai.','bad');return}
 S.ui.cfErr=false;f.confNote=note;log(f,'Ubah status konfirmasi'+(note?` · ${note}`:''),f.conf,res);f.conf=res;
 if(res==='Tidak Sesuai')notify(['Sales','Purchasing'],f.id,`Konfirmasi Tidak Sesuai: ${f.id} ${f.cust}`);else toast('Konfirmasi Sesuai. Tombol kerjakan breakdown aktif.','ok');
 render();
};
A.finish=fid=>{const f=getF(fid);A.ask('Kerjakan breakdown?','Prototype: pekerjaan langsung ditandai Selesai.','Tandai Selesai',()=>{f.done=true;log(f,'Ubah status pekerjaan','Dikerjakan','Selesai');toast('Breakdown selesai','ok')})};

/* comments */
A.comment=fid=>{
 const f=getF(fid),t=($('#cm-in')||{}).value||'';if(!t.trim())return;
 f.comments.push({t:now().getTime(),role:S.role,user:PERSON[S.role],text:t.trim()});
 const others=ROLES.filter(r=>r!==S.role);
 S.notifs.unshift({id:uid(),roles:others,fid,text:`Comment baru dari ${S.role}: ${f.id}`,t:now().getTime(),read:{}});
 toast(`Comment terkirim. Role lain di form ini dinotifikasi.`,'ok');render();
};

/* quotation */
A.makeQuote=fid=>{
 const f=getF(fid),c=custBy(f.cust);
 S.qseq++;const id='Q'+S.qseq;
 const exp=new Date(TODAY());exp.setDate(exp.getDate()+14);
 S.quotes.push({id,number:qno(S.qseq),formId:fid,versions:[{ver:1,date:now().getTime(),expiry:iso(exp),subject:`Penawaran ${f.cust}`,desc:'',owner:PERSON.Sales,pic:c.pic||'',email:c.email||'',addr:c.addr||'',lead:'',termin:'DP 50% setelah PO, pelunasan setelah pekerjaan selesai',estimasi:'7-14 hari kerja setelah barang diterima',catatan:'',status:'Belum Dikirim',sentTo:'',cc:'',sentAt:null,items:act(f).map(i=>({iid:i.id,name:i.name,qty:i.qty,price:i.price,disc:0}))}]});
 log(f,'Buat Quotation v1','—','Belum Dikirim');toast('Quotation dibuat dari Form Breakdown. Item dan harga terisi otomatis.','ok');
 S.ui.qtab='info';A.go('#/quotes/'+id);
};
function editableQ(q){return S.role==='Sales'&&((S.ui.qv&&S.ui.qv[q.id]!=null)?S.ui.qv[q.id]:q.versions.length-1)===q.versions.length-1}
A.qset=(qid,k,val)=>{
 const q=getQid(qid);if(!q||!editableQ(q))return;
 let v=lastV(q);if(v[k]===val)return;
 if(v.status==='Terkirim')v=newVersion(q,'revisi isi quotation');
 v[k]=val;render();
};
A.qdisc=(qid,iid,val)=>{
 const q=getQid(qid);if(!q||!editableQ(q))return;
 let v=lastV(q);const n=Math.max(Number(val)||0,0);
 const cur=v.items.find(i=>i.iid===iid);if(cur.disc===n)return;
 if(v.status==='Terkirim')v=newVersion(q,'revisi diskon');
 v.items.find(i=>i.iid===iid).disc=n;render();
};
A.qver=(qid,i)=>{(S.ui.qv=S.ui.qv||{})[qid]=i;render()};
A.qtab=t=>{S.ui.qtab=t;render()};
A.saveQ=()=>toast('Quote disimpan.','ok');
A.send=qid=>{const q=getQid(qid),v=lastV(q);A.modal('send',{qid,to:v.sentTo||v.email,cc:v.cc||''})};
A.doSend=()=>{
 const m=S.modal,q=getQid(m.qid),v=lastV(q),f=q.formId&&getF(q.formId);
 const to=$('#sd-to').value.trim(),cc=$('#sd-cc').value.trim(),fail=$('#sd-fail').checked,er=$('#sd-err');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){er.textContent='Email tujuan belum valid. Email PIC wajib untuk pengiriman.';return}
 const resend=!!v.sentAt||v.status==='Gagal Kirim',old=v.status;
 v.sentTo=to;v.cc=cc;v.sentAt=now().getTime();v.status=fail?'Gagal Kirim':'Terkirim';
 S.modal=null;
 if(f)log(f,`${resend?'Kirim ulang':'Kirim'} Quotation v${v.ver} ke ${to}${cc?` (CC ${cc})`:''}`,old,v.status);
 toast(fail?`Pengiriman gagal ke ${to}. Kirim ulang dari halaman quote.`:`Quotation v${v.ver} terkirim ke ${to}`,fail?'bad':'ok');render();
};
A.preview=(qid,i)=>A.modal('preview',{qid,vi:i});

/* suppliers */
A.supEdit=id=>A.modal('supplier',{id});
A.supSave=()=>{
 const m=S.modal,name=$('#sp-name').value.trim(),er=$('#sp-err');
 if(!name){er.textContent='Nama supplier wajib diisi.';return}
 const o={name,contact:$('#sp-contact').value.trim(),cats:$('#sp-cats').value.split(',').map(s=>s.trim()).filter(Boolean),active:$('#sp-active').value==='1'};
 if(m.id){Object.assign(S.suppliers.find(s=>s.id===m.id),o)}else S.suppliers.unshift(Object.assign({id:uid()},o));
 S.modal=null;toast('Supplier disimpan.','ok');render();
};
A.supTog=id=>{const s=S.suppliers.find(x=>x.id===id);s.active=!s.active;toast(`${s.name} ${s.active?'diaktifkan':'dinonaktifkan'}`);render()};

/* ===== views ===== */
const pager=n=>`<div class="pager">Per Page <select aria-label="Per page"><option>10</option></select> 1 - ${n} of ${n}</div>`;
const head=(crumbs,title,acts)=>`<div class="card"><div class="phead"><div><div class="crumb"><a href="#/breakdown">Dashboard</a>${crumbs.map(c=>` / ${c[1]?`<a href="${c[1]}">${esc(c[0])}</a>`:esc(c[0])}`).join('')}</div><h1>${esc(title)}</h1></div><div class="acts">${acts||''}</div></div></div>`;
const turnB=f=>{const t=turnOf(f);return t?roleB(t.role):'<span class="b gray">—</span>'};

function pgList(){
 const u=S.ui,q=(u.lq||'').toLowerCase();
 const rows=S.forms.filter(f=>(!q||(f.id+' '+f.cust).toLowerCase().includes(q))&&(!u.lst||f.status===u.lst)&&(!u.mine||(turnOf(f)&&turnOf(f).role===S.role)));
 const mineN=S.forms.filter(f=>turnOf(f)&&turnOf(f).role===S.role).length;
 return head([['Form Breakdown']],'Form Breakdown',`<button class="btn" onclick="A.go('#/breakdown/new')" ${S.role!=='Teknisi'?'title="Form baru hanya dibuat oleh Teknisi"':''}>${ic('plus')}Buat Form</button>`)+
 `<div class="card"><div class="tools"><div class="spill">${ic('search')}<input data-keep="lq" placeholder="Search" aria-label="Search" value="${esc(u.lq||'')}" oninput="A.setUI('lq',this.value)"></div>
 <button class="btn info" onclick="A.tog('lf')">Filter</button>
 <label style="display:flex;gap:7px;align-items:center;cursor:pointer"><input type="checkbox" ${u.mine?'checked':''} onchange="A.setUI('mine',this.checked)"> Giliran ${esc(S.role)} <span class="b ${mineN?'pri':'gray'}">${mineN}</span></label>
 ${pager(rows.length)}</div>
 ${u.lf?`<div class="filt"><div><label class="l">Status pengajuan</label><select onchange="A.setUI('lst',this.value)"><option value="">Semua</option>${['Draft','Diajukan','Harga Terisi','Disetujui','Batal'].map(s=>`<option ${u.lst===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`:''}
 <div class="wrapx"><table class="tbl"><thead><tr><th>No. Form</th><th>Customer</th><th>Teknisi</th><th>Tanggal Analisa</th><th>Pengajuan</th><th>Pengadaan</th>${S.role==='Sales'?'':'<th>Penerimaan</th>'}<th>Konfirmasi</th><th>Giliran</th><th class="num">Total Harga</th><th>Quotation</th></tr></thead><tbody>
 ${rows.map(f=>{const qq=getQ(f.id),v=qq&&lastV(qq);return `<tr class="row" onclick="A.go('#/breakdown/${f.id}')"><td><a>${f.id}</a></td><td>${esc(f.cust)}</td><td>${esc(f.tech)}</td><td>${fd(f.date)}</td><td>${badge(f.done?'Selesai':f.status)}</td><td>${badge(procOf(f))}</td>${S.role==='Sales'?'':`<td>${badge(recvOf(f))}</td>`}<td>${badge(f.status==='Batal'||f.status==='Draft'||f.status==='Diajukan'||f.status==='Harga Terisi'?'—':f.conf)}</td><td>${turnB(f)}</td><td class="num">${total(f)?rp(total(f)):'—'}</td><td>${v?`v${v.ver} ${badge(v.status)}${expired(v)?' '+badge('Kedaluwarsa'):''}`:'—'}</td></tr>`}).join('')||`<tr><td colspan="11" class="empty">Tidak ada form yang cocok dengan filter.</td></tr>`}
 </tbody></table></div></div>`;
}

function pgNew(){
 if(S.role!=='Teknisi')return head([['Form Breakdown','#/breakdown'],['Buat Form']],'Buat Form Breakdown')+`<div class="card"><div class="banner stop" style="margin:0">${ic('lock')}<div><b>Form baru hanya bisa dibuat oleh Teknisi</b>Anda login sebagai ${esc(S.role)}. Ganti role untuk mencoba mengisi form analisa.</div></div><div class="acts" style="margin-top:14px"><button class="btn" onclick="A.setRole('Teknisi')">Masuk sebagai Teknisi</button></div></div>`;
 if(!S.ui.nf)A.nfInit();
 const n=S.ui.nf,e=S.ui.nfErr||{};
 return head([['Form Breakdown','#/breakdown'],['Buat Form']],'Buat Form Breakdown',`<button class="btn sec" onclick="A.nfSave(false)">Simpan draft</button><button class="btn" onclick="A.nfSave(true)">Ajukan form</button>`)+
 `<div class="card"><h3>Hasil analisa</h3><p class="sub">Catat hasil analisa lapangan. Setelah diajukan, form tidak bisa diedit teknisi.</p>
 <div class="grid2">
 <div class="fld"><label class="l">Customer <span class="req">*</span></label><select class="${e.cust?'miss':''}" onchange="A.nf('cust',this.value)"><option value="">Click to add</option>${S.customers.map(c=>`<option ${n.cust===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${e.cust?`<div class="err">${e.cust}</div>`:''}</div>

function stepper(f){
 const s=stepOf(f),sales=S.role==='Sales';
 const list=STEPS.map((x,i)=>({x,i})).filter(o=>!(sales&&o.i===5));
 const cur=(sales&&s.cur===5)?4:s.cur;
 return `<div class="steps" role="list">${list.map((o,pos)=>{
  const i=o.i;let c='';if(s.cur===8||i<cur)c='done';else if(i===cur)c=s.stop?'stop':(s.warn?'warn':'cur');
  const lab=c==='done'?'✓':(c==='stop'?'✕':pos+1);
  const nm=(i===3&&s.stop)?'Batal':o.x[0];
  return `<div class="st ${c}" role="listitem"><i>${lab}</i><b>${nm}</b><small>${o.x[1]}</small></div>`}).join('')}</div>`;
}

/* ===== labeling ===== */
function labelOf(c){
 const last=c.purchases.reduce((m,p)=>p.date>m?p.date:m,'');
 const t=TODAY(),cut=iso(new Date(t.getFullYear(),t.getMonth()-6,t.getDate()));
 const mesin=c.purchases.filter(p=>p.type==='mesin').reduce((s,p)=>s+p.qty,0);
 return{last,cut,active:last>=cut,mesin,cls:mesin===0?'—':mesin<=2?'C':mesin<=5?'B':'A'};
}
const fuOf=c=>c.acts.some(a=>a.date.slice(0,7)===iso(TODAY()).slice(0,7));

 const m=S.modal;if(!m)return'';
 let b='';
 if(m.type==='confirm')b=`<div class="mod" role="dialog" aria-modal="true"><h3>${esc(m.title)}</h3><p class="sub" style="color:var(--muted)">${esc(m.text)}</p><div class="acts"><button class="btn sec" onclick="A.close()">Kembali</button><button class="btn" onclick="A.okAsk()">${esc(m.okLabel)}</button></div></div>`;
 if(m.type==='assume')b=`<div class="mod wide" role="dialog" aria-modal="true"><h3>Asumsi dan titik TBC dari PRD</h3><p class="sub" style="color:var(--muted)">Prototype mengikuti PRD Draft 7 apa adanya. Titik berikut ditandai TBC di UI supaya bisa langsung direspons stakeholder.</p><div class="wrapx"><table class="tbl"><tbody>${ASSUME.map(a=>`<tr><td style="width:34%"><b>${a[0]}</b></td><td>${a[1]}</td></tr>`).join('')}</tbody></table></div><div class="acts"><button class="btn" onclick="A.close()">Tutup</button></div></div>`;
 if(m.type==='receive'){const f=getF(m.fid),it=f.items.find(i=>i.id===m.iid);
  b=`<div class="mod" role="dialog" aria-modal="true"><h3>Stock In</h3><p class="sub" style="color:var(--muted)">${esc(it.name)} · Supplier ${esc(it.supplier)} · sisa ${remain(it)} dari ${it.qty}</p>
  <div class="grid2"><div><label class="l">Tanggal terima <span class="req">*</span></label><input id="rv-date" type="date" value="${m.date}"></div><div><label class="l">Qty diterima <span class="req">*</span></label><input id="rv-qty" type="number" min="1" value="${m.qty}"></div>
  <div class="fld full"><label class="l">Kondisi <span class="req">*</span></label><select id="rv-cond"><option>Baik</option><option>Rusak</option></select></div><div class="fld full"><label class="l">Catatan</label><textarea id="rv-note" style="min-height:60px"></textarea></div></div>
  <div class="hint">${ic('info')}Pilih Rusak: status pengadaan otomatis jadi Perlu Follow Up dan Purchasing dinotifikasi. Baik: On Hand produk bertambah. Placeholder fitur Stock In app live, tampilan final mengikuti app.</div><div class="err" id="rv-err"></div>
  <div class="acts"><button class="btn sec" onclick="A.close()">Batal</button><button class="btn" onclick="A.saveRecv()">Simpan Stock In</button></div></div>`}
 if(m.type==='preview'){const q=getQid(m.qid);
  b=`<div class="mod wide" role="dialog" aria-modal="true"><h3>Preview dokumen quotation</h3><p class="sub" style="color:var(--muted)">PDF dihasilkan otomatis dari data form. Tampilan di bawah adalah simulasi.</p>${docHtml(q,m.vi)}<div class="acts"><button class="btn sec" onclick="A.close()">Tutup</button>${S.role==='Sales'&&m.vi===q.versions.length-1?`<button class="btn" onclick="A.send('${q.id}')">${ic('send')}${lastV(q).sentAt?'Kirim ulang':'Kirim email'}</button>`:''}</div></div>`}
 if(m.type==='send'){const q=getQid(m.qid),v=lastV(q),f=q.formId&&getF(q.formId);
  const sub=`Penawaran ${v.subject} (${q.number})`;
  const body=`Dengan hormat,\n\nTerlampir penawaran ${v.subject} (${q.number}, v${v.ver}) untuk ${f?f.cust:'Bapak/Ibu'}. Penawaran berlaku sampai ${fd(v.expiry)}.\n\nMohon konfirmasi dari Bapak/Ibu.\n\nHormat kami,\n${v.owner}\nPT Ditajaya Mitra Perkasa`;
  b=`<div class="mod wide" role="dialog" aria-modal="true"><h3>${v.sentAt?'Kirim ulang':'Kirim'} quotation v${v.ver} via email</h3><p class="sub" style="color:var(--muted)">Subject dan isi email berasal dari template dan bisa diedit sebelum kirim.</p>
  <div class="grid2"><div><label class="l">Kepada (email PIC) <span class="req">*</span></label><input id="sd-to" type="email" value="${esc(m.to)}" placeholder="pic@customer.com"></div><div><label class="l">CC</label><input id="sd-cc" value="${esc(m.cc)}" placeholder="Opsional"></div>
  <div class="fld full"><label class="l">Subject</label><input id="sd-sub" value="${esc(sub)}"></div><div class="fld full"><label class="l">Isi email</label><textarea id="sd-body" style="min-height:150px">${esc(body)}</textarea></div>
  <div class="fld full"><label class="l">Lampiran</label><span class="b info">${ic('file').replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')} Quotation-${esc(q.number.replace(/\//g,'-'))}-v${v.ver}.pdf</span></div></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px;cursor:pointer"><input id="sd-fail" type="checkbox"> Simulasikan Gagal Kirim <small style="color:var(--muted)">(khusus demo)</small></label><div class="err" id="sd-err"></div>
  <div class="acts"><button class="btn sec" onclick="A.close()">Batal</button><button class="btn" onclick="A.doSend()">${ic('send')}Kirim email</button></div></div>`}
 if(m.type==='supplier'){const s=m.id?S.suppliers.find(x=>x.id===m.id):{name:'',contact:'',cats:[],active:true};
  b=`<div class="mod" role="dialog" aria-modal="true"><h3>${m.id?'Edit':'Tambah'} supplier</h3><p class="sub" style="color:var(--muted)">Field masih usulan.</p><div class="grid2"><div class="fld full"><label class="l">Nama supplier <span class="req">*</span></label><input id="sp-name" value="${esc(s.name)}"></div><div class="fld full"><label class="l">Kontak</label><input id="sp-contact" value="${esc(s.contact)}" placeholder="Nama · nomor telepon"></div><div class="fld full"><label class="l">Kategori barang <small style="color:var(--muted);font-weight:400">pisahkan dengan koma</small></label><input id="sp-cats" value="${esc(s.cats.join(', '))}"></div><div class="fld full"><label class="l">Status</label><select id="sp-active"><option value="1" ${s.active?'selected':''}>Aktif</option><option value="0" ${s.active?'':'selected'}>Nonaktif</option></select></div></div><div class="err" id="sp-err"></div><div class="acts"><button class="btn sec" onclick="A.close()">Batal</button><button class="btn" onclick="A.supSave()">Simpan</button></div></div>`}
 return `<div class="ov" onclick="if(event.target===this)A.close()">${b}</div>`;
}
function render(){
 const y=window.scrollY,ae=document.activeElement,key=ae&&ae.dataset&&ae.dataset.keep,pos=ae&&ae.selectionStart;
 const p=(location.hash.replace(/^#\/?/,'')||'breakdown').split('/');
 let html,act;
 if(p[0]==='quotes'){html=p[1]?pgQuote(p[1]):pgQuotes();act='quotes'}
 else if(p[0]==='organizations'||p[0]==='labeling'){html=pgOrgs();act='organizations'}
 else if(p[0]==='suppliers'){html=pgSuppliers();act='suppliers'}
 else if(p[0]==='bundling'){html=pgBundling();act='bundling'}
 else{act='breakdown';html=p[1]==='new'?pgNew():(p[1]?pgDetail(p[1]):pgList())}
 $('#app').innerHTML=shell(html,act)+modalHtml();
 window.scrollTo(0,y);
 if(key){const el=document.querySelector(`[data-keep="${key}"]`);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
window.addEventListener('hashchange',()=>{S.ui.attempt=null;S.ui.bell=false;if(location.hash.indexOf('breakdown/new')<0)S.ui.nf=null;render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)A.close()});
document.addEventListener('click',e=>{if(S.ui.bell&&!e.target.closest('.bellwrap')){S.ui.bell=false;render()}});
seed();render();
</script>
</body>
</html>
